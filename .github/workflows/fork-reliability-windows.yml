name: Fork reliability Windows installer

on:
  push:
    branches: [codex/windows-installer-reliability]
    paths:
      - main/**
      - shared/**
      - tests/**
      - frontend/**
      - package.json
      - package-lock.json
      - .github/workflows/fork-reliability-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-reliability-windows-${{ github.sha }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'
  BASELINE_SHA: d8dfa7bc649f90e730db2f52f16c0d1843531a08

jobs:
  core:
    if: github.repository == 'Ahsan-Neural/FloCafe' && github.ref == 'refs/heads/codex/windows-installer-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: mkdir -p evidence
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx --no-install electron-rebuild -f -w better-sqlite3
      - name: Lint and desktop builds
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee evidence/lint.log
          npm run build 2>&1 | tee evidence/backend-build.log
          npm run build:frontend 2>&1 | tee evidence/frontend-build.log
      - name: Complete standard suite including pretest
        run: |
          set -o pipefail
          xvfb-run -a npm test 2>&1 | tee evidence/npm-test.log
          if grep -F 'Skipped (ABI mismatch)' evidence/npm-test.log; then
            echo 'Native ABI skips are not accepted as executed tests.'
            exit 1
          fi
      - name: Database audit and translation checks
        run: |
          set -o pipefail
          npm run audit:db 2>&1 | tee evidence/database-audit.log
          npm run i18n:check 2>&1 | tee evidence/i18n.log
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reliability-core-evidence
          path: evidence/
          retention-days: 30

  browser:
    if: github.repository == 'Ahsan-Neural/FloCafe' && github.ref == 'refs/heads/codex/windows-installer-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FLO_MATRIX_OFFLINE: '1'
      FLO_WHATSAPP_SOCKET_DISABLED: '1'
      FLO_E2E_SKIP_OPTIONAL_NETWORK: '1'
      E2E_BASE_URL: http://127.0.0.1:33101
      E2E_KDS_BASE_URL: http://127.0.0.1:33102
      E2E_SERVER_APP_BASE_URL: http://127.0.0.1:33103
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx --no-install electron-rebuild -f -w better-sqlite3
      - run: cd frontend && npx --no-install playwright install --with-deps chromium
      - name: Standard browser system tests
        run: npm run test:e2e:browser
      - name: Additional permission and kitchen tiers
        run: |
          cd frontend
          npx --no-install playwright test --config=playwright.config.ts --project=chromium --retries=0 --grep='@ci-tier1|@ci-tier2' --grep-invert='FINDING:|a paid order offers a refund, and issuing it settles against the recorded sale'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reliability-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 30

  windows:
    if: github.repository == 'Ahsan-Neural/FloCafe' && github.ref == 'refs/heads/codex/windows-installer-reliability'
    needs: [core, browser, crash-regression, multiuser-soak]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FLO_MATRIX_OFFLINE: '1'
      FLO_WHATSAPP_SOCKET_DISABLED: '1'
      FLO_E2E_SKIP_OPTIONAL_NETWORK: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Native Windows desktop system tests
        run: npm run test:e2e:electron
      - name: Build Windows x64 NSIS without publication
        run: npx --no-install electron-builder --win nsis --x64 --publish never --config.npmRebuild=false --config.nsis.runAfterFinish=false --config.publish.owner=Ahsan-Neural --config.publish.repo=FloCafe
      - name: Verify installer and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item -LiteralPath 'release/flocafe-3.14.0-fork.2-win-x64.exe'
          if ($installer.Length -lt 10000000) { throw 'Installer is unexpectedly small.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName | Format-List | Out-File 'release/SHA256.txt'
          [ordered]@{
            kind = 'fork-reliability-candidate'
            repository = 'Ahsan-Neural/FloCafe'
            sourceCommit = $env:GITHUB_SHA
            version = '3.14.0-fork.2'
            platform = 'windows-x64'
            signed = $false
            publishedRelease = $false
            runId = $env:GITHUB_RUN_ID
            limitations = @('Physical printer hardware not tested', 'No production customer data used', 'Main-process fatal OOM is outside renderer recovery coverage', 'Thirty-minute backend soak is not a multi-day live store trial')
          } | ConvertTo-Json -Depth 4 | Set-Content 'release/build-provenance.json'
      - name: Install and uninstall on disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'FloCafe-Reliability-Install'
          $installer = (Resolve-Path 'release/flocafe-3.14.0-fork.2-win-x64.exe').Path
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'Flo Cafe.exe'))) { throw 'Installed executable missing.' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'resources/app.asar'))) { throw 'Installed application archive missing.' }
          $env:FLO_TEST_EXPECTED_VERSION = '3.14.0-fork.2'
          $smokePath = Join-Path $env:RUNNER_TEMP 'flo-packaged-smoke.cjs'
          $env:FLO_TEST_INSTALLED_EXE = Join-Path $installDir 'Flo Cafe.exe'
          $env:FLO_TEST_PLAYWRIGHT = Join-Path (Get-Location).Path 'frontend/node_modules/playwright'
          $env:FLO_TEST_EVIDENCE = Join-Path (Get-Location).Path 'release'
          @'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { _electron: electron } = require(process.env.FLO_TEST_PLAYWRIGHT);
          (async () => {
            const profile = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'flo-installed-smoke-'));
            let application;
            try {
              application = await electron.launch({
                executablePath: process.env.FLO_TEST_INSTALLED_EXE,
                cwd: path.dirname(process.env.FLO_TEST_INSTALLED_EXE),
                timeout: 60000,
                env: { ...process.env, ELECTRON_RUN_AS_NODE: undefined, NODE_ENV: 'test',
                  FLO_E2E_USER_DATA_DIR: profile, FLO_E2E_DB_PATH: path.join(profile, 'flo.db'),
                  FLO_E2E_SKIP_OPTIONAL_NETWORK: '1', FLO_MATRIX_OFFLINE: '1',
                  FLO_E2E_HIDDEN_WINDOW: '1', PORT: '34101', KDS_PORT: '34102', SERVER_APP_PORT: '34103' },
              });
              const deadline = Date.now() + 60000;
              let page;
              while (Date.now() < deadline) {
                page = application.windows().find((window) => window.url().startsWith('http://localhost:34101'));
                if (page) break;
                await new Promise((resolve) => setTimeout(resolve, 200));
              }
              assert.ok(page, 'installed application must open its POS window');
              await page.waitForFunction(() => Boolean(window.electronAPI));
              const status = await page.evaluate(() => window.electronAPI.getStatus());
              assert.equal(status.server, 'running');
              assert.equal(status.kdsServer, 'running');
              assert.equal(status.serverApp, 'running');
              assert.equal(await application.evaluate(({ app }) => app.isPackaged), true);
              assert.equal(await application.evaluate(({ app }) => app.getVersion()), process.env.FLO_TEST_EXPECTED_VERSION);
              for (const port of [34101, 34102, 34103]) {
                const response = await fetch('http://127.0.0.1:' + port + '/api/health');
                assert.equal(response.ok, true);
              }
              await page.waitForFunction(() => document.body.innerText.trim().length > 20);
              await page.screenshot({ path: path.join(process.env.FLO_TEST_EVIDENCE, 'installed-startup.png') });
              fs.writeFileSync(path.join(process.env.FLO_TEST_EVIDENCE, 'packaged-startup.json'), JSON.stringify({ packaged: true, status, version: process.env.FLO_TEST_EXPECTED_VERSION, isolatedProfile: true }, null, 2));
            } finally {
              if (application) await application.close();
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          '@ | Set-Content -LiteralPath $smokePath
          node $smokePath
          if ($LASTEXITCODE -ne 0) { throw 'Installed application startup smoke test failed.' }
          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter '*Uninstall*.exe' -File | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller missing.' }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)" }
          'Silent install, installed runtime startup, service health, screenshot, and uninstaller checks passed on disposable runner.' | Set-Content 'release/installer-check.txt'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: flocafe-3.14.0-fork.2-reliability-windows-x64
          path: |
            release/flocafe-3.14.0-fork.2-win-x64.exe
            release/SHA256.txt
            release/build-provenance.json
            release/installer-check.txt
            release/packaged-startup.json
            release/installed-startup.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reliability-windows-test-evidence
          path: frontend/test-results/
          retention-days: 30

  crash-regression:
    if: github.repository == 'Ahsan-Neural/FloCafe' && github.ref == 'refs/heads/codex/windows-installer-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FLO_MATRIX_OFFLINE: '1'
      FLO_E2E_SKIP_OPTIONAL_NETWORK: '1'
      FLO_WHATSAPP_SOCKET_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx --no-install electron-rebuild -f -w better-sqlite3
      - run: npm run build:frontend
      - name: Prove regression detects the original blocking dialog
        shell: bash
        run: |
          mkdir -p evidence
          cp main/index.ts "$RUNNER_TEMP/fork-candidate-index.ts"
          git show "$BASELINE_SHA:main/index.ts" > main/index.ts
          npm run build
          set +e
          (cd frontend && xvfb-run -a npx --no-install playwright test e2e/desktop/automatic-crash-recovery.electron.spec.ts --config=playwright.electron.config.ts --project=electron-desktop --retries=0 --grep='recovers automatically' --reporter=json) > evidence/original-crash-regression.json
          baseline_status=$?
          set -e
          if [ "$baseline_status" -eq 0 ]; then
            echo 'Regression unexpectedly passed against the original renderer handler.'
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync('evidence/original-crash-regression.json', 'utf8'));
          console.log('Original regression results:', JSON.stringify(report.stats));
          console.log('Original regression suites:', JSON.stringify(report.suites));
          assert.equal(report.stats.unexpected, 2);
          assert.equal(report.stats.skipped, 0);
          const failures = [];
          function walk(suite) {
            for (const spec of suite.specs || []) for (const test of spec.tests || []) {
              for (const result of test.results || []) if (result.status !== 'passed') failures.push(result);
            }
            for (const child of suite.suites || []) walk(child);
          }
          for (const suite of report.suites) walk(suite);
          assert.equal(failures.length, 2);
          for (const failure of failures) assert.match(JSON.stringify(failure.errors), /recovery must not require a crash dialog/);
          console.log('Both original-handler failures are the intended crash-dialog regression.');
          NODE
          cp "$RUNNER_TEMP/fork-candidate-index.ts" main/index.ts
      - name: Prove regression detects premature restart-budget reset
        shell: bash
        run: |
          git show 6afe40f623d540461a95fbdab8f06745f652a18e:main/index.ts > main/index.ts
          npm run build
          set +e
          (cd frontend && xvfb-run -a npx --no-install playwright test e2e/desktop/automatic-crash-recovery.electron.spec.ts --config=playwright.electron.config.ts --project=electron-desktop --retries=0 --grep='relaunch loop' --reporter=json) > evidence/previous-restart-budget.json
          previous_status=$?
          set -e
          if [ "$previous_status" -eq 0 ]; then
            echo 'Restart-loop regression unexpectedly passed against the previous handler.'
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync('evidence/previous-restart-budget.json', 'utf8'));
          assert.equal(report.stats.unexpected, 1);
          assert.equal(report.stats.skipped, 0);
          const failures = [];
          function walk(suite) {
            for (const spec of suite.specs || []) for (const test of spec.tests || []) {
              for (const result of test.results || []) if (result.status !== 'passed') failures.push(result);
            }
            for (const child of suite.suites || []) walk(child);
          }
          for (const suite of report.suites) walk(suite);
          assert.equal(failures.length, 1);
          assert.match(JSON.stringify(failures[0].errors), /restart budget must remain exhausted until the renderer is stable/);
          console.log('The previous handler fails the intended restart-budget regression.');
          NODE
          cp "$RUNNER_TEMP/fork-candidate-index.ts" main/index.ts
      - name: Verify automatic recovery with the candidate handler
        shell: bash
        run: |
          npm run build
          cd frontend
          xvfb-run -a npx --no-install playwright test e2e/desktop/automatic-crash-recovery.electron.spec.ts --config=playwright.electron.config.ts --project=electron-desktop --retries=0 --reporter=json > ../evidence/candidate-crash-regression.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reliability-crash-regression-evidence
          path: |
            evidence/
            frontend/test-results/
          retention-days: 30

  multiuser-soak:
    if: github.repository == 'Ahsan-Neural/FloCafe' && github.ref == 'refs/heads/codex/windows-installer-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLO_WORKLOAD_WAVE_DELAY_MS: '10000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx --no-install electron-rebuild -f -w better-sqlite3
      - name: Thirty-minute multi-user backend workload and reconciliation
        shell: bash
        run: |
          mkdir -p evidence
          set -o pipefail
          xvfb-run -a node <<'NODE' 2>&1 | tee evidence/multiuser-soak.log
          const { spawnSync } = require('node:child_process');
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const result = spawnSync(require('electron'), [
            '--expose-gc', '--import', pathToFileURL(require.resolve('tsx')).href,
            '-r', path.resolve('tests/register-tsx.cjs'),
            path.resolve('tests/fork-multiuser-workload.test.ts'),
          ], {
            stdio: 'inherit',
            env: { ...process.env, ELECTRON_RUN_AS_NODE: '1', TSX_TSCONFIG_PATH: path.resolve('tests/tsconfig.json') },
            timeout: 35 * 60 * 1000,
          });
          if (result.error) console.error(result.error);
          if (result.signal) console.error('Soak terminated by signal:', result.signal);
          process.exit(result.status ?? 1);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reliability-multiuser-soak-evidence
          path: evidence/
          retention-days: 30
